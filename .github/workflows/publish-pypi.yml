name: Publish to PyPI

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type "publish" to confirm. Anything else runs in --dry-run.'
        required: true
        default: 'dry-run'

jobs:
  publish:
    name: Build + publish ancilla to PyPI
    runs-on: ubuntu-latest
    environment:
      name: pypi-publish
      url: https://pypi.org/project/ancilla/
    permissions:
      id-token: write   # required for OIDC trusted publishing — no token needed
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install build tools
        run: |
          python -m pip install --upgrade pip build twine

      - name: Build sdist + wheel
        working-directory: python
        run: python -m build

      - name: Validate package
        working-directory: python
        run: twine check --strict dist/*

      - name: Show what will be published
        working-directory: python
        run: |
          echo "::group::sdist contents"
          tar -tzf dist/*.tar.gz | head -50
          echo "::endgroup::"
          echo "::group::wheel contents"
          python -m zipfile -l dist/*.whl
          echo "::endgroup::"

      - name: Publish to PyPI (OIDC trusted publisher)
        if: ${{ inputs.confirm == 'publish' }}
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: python/dist/
          print-hash: true

      - name: Dry-run notice
        if: ${{ inputs.confirm != 'publish' }}
        run: |
          echo "::warning::This was a dry-run. To actually publish, re-run with confirm=publish."
